appId: com.bbankroll.app
productName: Bare Bones Bankroll

directories:
  output: dist-electron

# Disable asar so process.chdir() and dotenv work correctly on the server
asar: false

# Files bundled into the app package
files:
  - electron/**/*
  - server/**/*
  - client/dist/**/*
  - "!server/tests"
  - "!server/node_modules/.cache"
  - "!server/node_modules/.bin"
  - "!**/*.test.js"
  # Never ship secrets — packaged builds read %APPDATA%\Bare Bones Bankroll\config.env
  - "!**/.env"
  - "!**/.env.*"
  - "!**/config.env"
  - "!server/scripts"

win:
  target:
    - nsis
  icon: client/public/ms-icon-310x310.png

nsis:
  # No spaces: GitHub renames spaces in uploaded assets, which would break the
  # download URL that latest.yml gives the auto-updater
  artifactName: Bare-Bones-Bankroll-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: STJOHNL
  repo: bare-bones-bankroll
